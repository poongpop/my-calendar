<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>내 캘린더</title>
<style>
:root{
  --bg:#ffffff;--fg:#1f2330;--muted:#8a90a2;--line:#e7e9f0;--soft:#f5f6fa;
  --accent:#4f46e5;--accent-soft:#eef0ff;--sun:#e5484d;--sat:#3b6fe0;--danger:#e5484d;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#15171e;--fg:#e8eaf0;--muted:#7d8396;--line:#2a2e3a;--soft:#1d2029;
    --accent:#8b85ff;--accent-soft:#25264a;--sun:#ff6b6f;--sat:#6f9bff;}
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;
  -webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:6px;
  padding:calc(10px + env(safe-area-inset-top)) 14px 10px;background:var(--bg);border-bottom:1px solid var(--line)}
header h1{font-size:19px;margin:0 6px;min-width:120px;text-align:center;font-weight:700}
.icon-btn{width:36px;height:36px;border-radius:10px;font-size:20px;display:grid;place-items:center}
.icon-btn:hover{background:var(--soft)}
.pill{white-space:nowrap;flex:none;padding:6px 12px;border-radius:999px;border:1px solid var(--line);font-size:14px}
.spacer{flex:1;min-width:0}
.status{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40vw}
.status.err{color:var(--danger)}
main{display:flex;gap:0;min-height:calc(100% - 60px)}
.cal{flex:1;padding:8px 10px 10px;min-width:0}
.weekdays,.grid{display:grid;grid-template-columns:repeat(7,1fr)}
.weekdays div{text-align:center;font-size:12px;color:var(--muted);padding:6px 0}
.weekdays div:first-child{color:var(--sun)}.weekdays div:last-child{color:var(--sat)}
.grid{border-top:1px solid var(--line);border-left:1px solid var(--line)}
.cell{border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-height:96px;
  padding:4px;text-align:left;display:flex;flex-direction:column;gap:2px;overflow:hidden;border-radius:0}
.cell:hover{background:var(--soft)}
.cell .num{font-size:13px;width:24px;height:24px;display:grid;place-items:center;border-radius:50%}
.cell.sun .num{color:var(--sun)}.cell.sat .num{color:var(--sat)}
.cell.other{opacity:.38}
.cell.today .num{background:var(--accent);color:#fff}
.cell.sel{background:var(--accent-soft)}
.chips{display:flex;flex-direction:column;gap:2px;min-width:0}
.chip{font-size:11px;line-height:16px;padding:0 5px;border-radius:4px;color:#fff;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.more{font-size:11px;color:var(--muted);padding-left:4px}
aside{width:340px;border-left:1px solid var(--line);padding:14px 16px;background:var(--bg)}
.dayhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.dayhead h2{font-size:16px;margin:0}
.add{background:var(--accent);color:#fff;padding:8px 14px;border-radius:10px;font-weight:600;font-size:14px}
ul.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
ul.list li{display:flex;gap:10px;padding:10px;border-radius:12px;background:var(--soft);cursor:pointer}
ul.list .bar{width:4px;border-radius:2px;flex:none}
ul.list .t{font-size:12px;color:var(--muted)}
ul.list .ti{font-weight:600;margin:1px 0}
ul.list .memo{font-size:13px;color:var(--muted);white-space:pre-wrap;word-break:break-word}
.empty{color:var(--muted);font-size:14px;padding:20px 0;text-align:center}
.fab{display:none}
body.notes-mode main,body:not(.notes-mode) #notesView,body.notes-mode .cal-only{display:none}
.notes{padding:14px 16px calc(90px + env(safe-area-inset-bottom));max-width:1100px;margin:0 auto}
.notes-bar{display:flex;gap:8px;margin-bottom:12px;align-items:center}
.notes-bar input{flex:1}
.ngrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.ngrid .empty{grid-column:1/-1}
.ncard{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-align:left;
  display:flex;flex-direction:column;gap:6px;min-height:110px;min-width:0}
.ncard:hover{border-color:var(--accent)}
.ncard .nt{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ncard .np{font-size:13px;color:var(--muted);white-space:pre-wrap;word-break:break-word;
  display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.ncard .nd{font-size:11px;color:var(--muted);margin-top:auto}
#noteDlg{width:min(680px,96vw)}
#noteText{min-height:50vh;font-size:15px;line-height:1.6;background:var(--bg)}
@media (max-width:760px){
  main{flex-direction:column;min-height:0}
  .cal{flex:none}
  header{gap:2px;padding-left:8px;padding-right:8px}
  .status{max-width:28vw}
  aside{width:auto;border-left:0;border-top:1px solid var(--line);padding-bottom:calc(90px + env(safe-area-inset-bottom))}
  .cell{min-height:58px;padding:3px 2px;align-items:center}
  .chips{flex-direction:row;flex-wrap:wrap;justify-content:center;gap:2px}
  .chip{font-size:0;width:6px;height:6px;padding:0;border-radius:50%}
  .more{display:none}
  header h1{font-size:17px;min-width:96px}
  .hide-m{display:none}
  .fab{display:grid;position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));width:56px;height:56px;
    border-radius:18px;background:var(--accent);color:#fff;font-size:28px;place-items:center;box-shadow:0 6px 20px rgba(0,0,0,.25);z-index:6}
  .dayhead .add,#addNoteBtn{display:none}
}
dialog{border:0;border-radius:16px;padding:0;width:min(440px,94vw);background:var(--bg);color:var(--fg);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(10,12,20,.45)}
form.f{padding:18px;display:flex;flex-direction:column;gap:12px}
form.f h3{margin:0 0 2px;font-size:17px}
label{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:5px}
input,textarea,select{font:inherit;color:var(--fg);background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%}
input:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
textarea{min-height:70px;resize:vertical}
.row{display:flex;gap:10px}.row>*{flex:1}
.check{flex-direction:row;align-items:center;gap:8px;color:var(--fg);font-size:14px}
.check input{width:auto}
.colors{display:flex;gap:8px}
.colors input{display:none}
.colors span{width:26px;height:26px;border-radius:50%;display:block;cursor:pointer;border:3px solid transparent}
.colors input:checked+span{border-color:var(--fg)}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:4px}
.btn{padding:9px 16px;border-radius:10px;background:var(--soft);font-weight:600;font-size:14px}
.btn.primary{background:var(--accent);color:#fff}
.btn.danger{color:var(--danger);margin-right:auto}
.note{font-size:12px;color:var(--muted);line-height:1.5}
.msg{font-size:13px;line-height:1.5;white-space:pre-wrap}
.msg.ok{color:#16a34a}.msg.bad{color:var(--danger)}
</style>
</head>
<body>
<header>
  <button class="icon-btn cal-only" id="prev" aria-label="이전 달">‹</button>
  <h1 id="title"></h1>
  <button class="icon-btn cal-only" id="next" aria-label="다음 달">›</button>
  <button class="pill cal-only" id="todayBtn">오늘</button>
  <div class="spacer"></div>
  <span class="status" id="status"></span>
  <button class="icon-btn" id="modeBtn" title="메모" aria-label="메모/캘린더 전환">📝</button>
  <button class="icon-btn" id="syncBtn" title="지금 동기화" aria-label="동기화">⟳</button>
  <button class="icon-btn" id="settingsBtn" title="설정" aria-label="설정">⚙︎</button>
</header>
<main>
  <section class="cal">
    <div class="weekdays"><div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div></div>
    <div class="grid" id="grid"></div>
  </section>
  <aside>
    <div class="dayhead"><h2 id="dayTitle"></h2><button class="add" id="addBtn">+ 일정</button></div>
    <ul class="list" id="dayList"></ul>
  </aside>
</main>
<section class="notes" id="notesView">
  <div class="notes-bar">
    <input id="noteSearch" type="search" placeholder="메모 검색" autocomplete="off">
    <button class="add" id="addNoteBtn">+ 새 메모</button>
  </div>
  <div class="ngrid" id="noteGrid"></div>
</section>
<button class="fab" id="fab" aria-label="일정 추가">+</button>

<dialog id="eventDlg">
  <form class="f" id="eventForm" method="dialog">
    <h3 id="eventDlgTitle">새 일정</h3>
    <label>제목<input name="title" required maxlength="200" autocomplete="off"></label>
    <div class="row">
      <label>시작일<input type="date" name="date" required></label>
      <label>종료일<input type="date" name="endDate"></label>
    </div>
    <label class="check"><input type="checkbox" name="allDay"> 종일</label>
    <div class="row" id="timeRow">
      <label>시작 시각<input type="time" name="start"></label>
      <label>종료 시각<input type="time" name="end"></label>
    </div>
    <div class="colors" id="colors"></div>
    <label>메모<textarea name="memo" maxlength="5000"></textarea></label>
    <div class="actions">
      <button type="button" class="btn danger" id="delBtn">삭제</button>
      <button type="button" class="btn" id="cancelBtn">취소</button>
      <button type="submit" class="btn primary">저장</button>
    </div>
  </form>
</dialog>

<dialog id="noteDlg">
  <form class="f" id="noteForm" method="dialog">
    <textarea id="noteText" placeholder="첫 줄이 제목이 됩니다" maxlength="20000"></textarea>
    <div class="actions" style="align-items:center">
      <span class="note" id="noteMeta" style="margin-right:auto"></span>
      <button type="button" class="btn danger" id="noteDel" style="margin-right:0">삭제</button>
      <button type="submit" class="btn primary">완료</button>
    </div>
  </form>
</dialog>

<dialog id="settingsDlg">
  <form class="f" id="settingsForm" method="dialog">
    <h3>동기화 설정</h3>
    <p class="note">일정은 아래 <b>비공개 저장소</b>의 JSON 파일에 저장됩니다. 토큰은 이 기기의 브라우저에만 저장되며 GitHub 외 어디로도 전송되지 않습니다.</p>
    <div class="row">
      <label>GitHub 사용자명<input name="owner" required autocomplete="off" autocapitalize="off" spellcheck="false"></label>
      <label>데이터 저장소<input name="repo" required autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="예: my-calendar-data"></label>
    </div>
    <div class="row">
      <label>브랜치<input name="branch" required value="main" autocapitalize="off" spellcheck="false"></label>
      <label>파일 경로<input name="path" required value="events.json" autocapitalize="off" spellcheck="false"></label>
    </div>
    <label>Fine-grained 토큰<input name="token" type="password" required autocomplete="off" spellcheck="false" placeholder="github_pat_..."></label>
    <div class="msg" id="testMsg"></div>
    <div class="actions">
      <button type="button" class="btn danger" id="logoutBtn">이 기기 초기화</button>
      <button type="button" class="btn" id="testBtn">연결 테스트</button>
      <button type="submit" class="btn primary">저장</button>
    </div>
    <div class="actions" style="justify-content:space-between">
      <button type="button" class="btn" id="exportBtn">백업 다운로드</button>
      <button type="button" class="btn" id="closeSettings">닫기</button>
    </div>
  </form>
</dialog>

<script>
'use strict';
/* ---------- 유틸 ---------- */
const $ = s => document.querySelector(s);
const COLORS = ['#4f46e5','#e5484d','#f59e0b','#16a34a','#0ea5e9','#a855f7','#64748b'];
const TOMBSTONE_DAYS = 90;
const LS = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); }catch{ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch{} },
  del(k){ try{ localStorage.removeItem(k); }catch{} }
};
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseYmd = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const WD = ['일','월','화','수','목','금','토'];

function b64encode(str){
  const bytes = new TextEncoder().encode(str); let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}
function b64decode(b64){
  const bin = atob((b64 || '').replace(/\s/g, ''));
  return new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0)));
}

/* ---------- 상태 ---------- */
let cfg = LS.get('cal.cfg', { owner:'', repo:'', token:'', branch:'main', path:'events.json' });
let events = LS.get('cal.events', []);       // 삭제 표시(tombstone) 포함
let notes = LS.get('cal.notes', []);         // 메모 (삭제 표시 포함)
let dirty = LS.get('cal.dirty', false);
let mode = LS.get('cal.mode', 'cal');
let lastSync = LS.get('cal.lastSync', 0);
let view = new Date(); view.setDate(1);
let selected = ymd(new Date());
const configured = () => !!(cfg.owner && cfg.repo && cfg.token);
const persist = () => { LS.set('cal.events', events); LS.set('cal.notes', notes); LS.set('cal.dirty', dirty); };

/* ---------- GitHub API ---------- */
function contentsUrl(c, withRef){
  const p = c.path.split('/').filter(Boolean).map(encodeURIComponent).join('/');
  return `https://api.github.com/repos/${encodeURIComponent(c.owner)}/${encodeURIComponent(c.repo)}/contents/${p}` +
    (withRef ? `?ref=${encodeURIComponent(c.branch)}` : '');
}
function ghHeaders(c, json){
  const h = { Authorization: `Bearer ${c.token}`, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' };
  if (json) h['Content-Type'] = 'application/json';
  return h;
}
async function httpError(r){
  let m = ''; try { m = (await r.json()).message || ''; } catch {}
  const e = new Error(`${r.status} ${m}`.trim()); e.status = r.status; return e;
}
async function fetchRemote(){
  const r = await fetch(contentsUrl(cfg, true), { cache:'no-store', headers: ghHeaders(cfg) });
  if (r.status === 404) return { events: [], notes: [], sha: null };
  if (!r.ok) throw await httpError(r);
  const j = await r.json();
  if (j.content == null || j.encoding === 'none') throw new Error('데이터 파일이 너무 큽니다(1MB 초과).');
  const text = b64decode(j.content).trim();
  const data = text ? JSON.parse(text) : {};
  return { events: Array.isArray(data.events) ? data.events : [], notes: Array.isArray(data.notes) ? data.notes : [], sha: j.sha };
}
async function putRemote(list, noteList, sha){
  const body = {
    message: `calendar: update (${navigator.platform || 'device'})`,
    content: b64encode(JSON.stringify({ version: 1, events: list, notes: noteList }, null, 1)),
    branch: cfg.branch
  };
  if (sha) body.sha = sha;
  return fetch(contentsUrl(cfg, false), { method:'PUT', cache:'no-store', headers: ghHeaders(cfg, true), body: JSON.stringify(body) });
}

/* ---------- 병합 (기기 간 충돌 해결) ---------- */
function newer(a, b){ // a가 b보다 최신이면 true
  if ((a.updatedAt||0) !== (b.updatedAt||0)) return (a.updatedAt||0) > (b.updatedAt||0);
  return JSON.stringify(a) > JSON.stringify(b); // 동시각이면 어느 기기에서든 같은 결과가 나오도록
}
function merge(a, b){
  const m = new Map();
  for (const e of [...a, ...b]) { if (!e || !e.id) continue; const cur = m.get(e.id); if (!cur || newer(e, cur)) m.set(e.id, e); }
  const cutoff = Date.now() - TOMBSTONE_DAYS * 864e5;
  return [...m.values()].filter(e => !(e.deleted && (e.updatedAt||0) < cutoff)).sort((x, y) => x.id < y.id ? -1 : x.id > y.id ? 1 : 0);
}
const canon = list => JSON.stringify(merge(list, []));

/* ---------- 동기화 ---------- */
let syncing = false, again = false, saveTimer = null;
function setStatus(text, err){ const s = $('#status'); s.textContent = text; s.classList.toggle('err', !!err); s.title = text; }
function idleStatus(){
  if (!configured()) return setStatus('⚙︎ 동기화 설정 필요', true);
  if (dirty) return setStatus(navigator.onLine ? '저장 대기 중…' : '오프라인 · 변경사항 보관 중');
  if (lastSync) { const d = new Date(lastSync); return setStatus(`동기화됨 ${pad(d.getHours())}:${pad(d.getMinutes())}`); }
  setStatus('');
}
async function sync(){
  if (!configured()) { idleStatus(); return; }
  if (syncing) { again = true; return; }
  if (!navigator.onLine) { idleStatus(); return; }
  syncing = true; setStatus('동기화 중…');
  try {
    let done = false;
    for (let attempt = 0; attempt < 4 && !done; attempt++) {
      const remote = await fetchRemote();
      const merged = merge(events, remote.events), mergedN = merge(notes, remote.notes);
      if (remote.sha && canon(merged) === canon(remote.events) && canon(mergedN) === canon(remote.notes)) { apply(merged, mergedN); done = true; break; }
      const r = await putRemote(merged, mergedN, remote.sha);
      if (r.status === 409 || r.status === 422) { await new Promise(res => setTimeout(res, 400 * (attempt + 1))); continue; } // 다른 기기가 먼저 저장함 → 다시 병합
      if (!r.ok) throw await httpError(r);
      apply(merged, mergedN); done = true;
    }
    if (!done) throw new Error('저장 충돌이 반복됩니다. 잠시 후 다시 시도하세요.');
    lastSync = Date.now(); LS.set('cal.lastSync', lastSync);
    idleStatus();
  } catch (e) {
    console.error(e);
    const hint = e.status === 401 ? '토큰이 잘못됐거나 만료됨' : e.status === 403 ? '권한 부족(토큰 권한 확인)' : e.status === 404 ? '저장소를 찾을 수 없음' : e instanceof TypeError ? '네트워크 오류' : (e.message || '오류');
    setStatus(`동기화 실패: ${hint}`, true);
  } finally {
    syncing = false;
    if (again) { again = false; sync(); }
  }
}
function apply(merged, mergedN){
  // 동기화 도중 사용자가 수정한 내용은 보존
  const combined = merge(events, merged), combinedN = merge(notes, mergedN);
  dirty = canon(combined) !== canon(merged) || canon(combinedN) !== canon(mergedN);
  events = combined; notes = combinedN; persist(); render(); renderNotes();
  if (dirty) again = true;
}
function scheduleSave(){ clearTimeout(saveTimer); saveTimer = setTimeout(sync, 800); idleStatus(); }

/* ---------- 일정 조작 ---------- */
const live = () => events.filter(e => !e.deleted);
const eventsOn = key => live().filter(e => e.date <= key && key <= (e.endDate || e.date))
  .sort((a, b) => (b.allDay - a.allDay) || (a.start || '').localeCompare(b.start || '') || a.title.localeCompare(b.title));
function upsert(ev){
  ev.updatedAt = Date.now();
  const i = events.findIndex(e => e.id === ev.id);
  if (i >= 0) events[i] = ev; else events.push(ev);
  dirty = true; persist(); render(); scheduleSave();
}
function remove(id){
  const e = events.find(x => x.id === id); if (!e) return;
  upsert({ id: e.id, deleted: true, date: e.date, title: '' });
}

/* ---------- 렌더링 ---------- */
function render(){
  $('#title').textContent = mode === 'notes' ? '메모' : `${view.getFullYear()}년 ${view.getMonth() + 1}월`;
  const grid = $('#grid'); grid.replaceChildren();
  const first = new Date(view.getFullYear(), view.getMonth(), 1);
  const start = new Date(first); start.setDate(1 - first.getDay());
  const today = ymd(new Date());
  const weeks = Math.ceil((first.getDay() + new Date(view.getFullYear(), view.getMonth() + 1, 0).getDate()) / 7);
  for (let i = 0; i < weeks * 7; i++) {
    const d = new Date(start); d.setDate(start.getDate() + i);
    const key = ymd(d);
    const cell = el('button', 'cell');
    if (d.getMonth() !== view.getMonth()) cell.classList.add('other');
    if (d.getDay() === 0) cell.classList.add('sun');
    if (d.getDay() === 6) cell.classList.add('sat');
    if (key === today) cell.classList.add('today');
    if (key === selected) cell.classList.add('sel');
    cell.append(el('span', 'num', d.getDate()));
    const list = eventsOn(key), chips = el('div', 'chips');
    list.slice(0, 3).forEach(e => { const c = el('span', 'chip', e.title); c.style.background = e.color || COLORS[0]; chips.append(c); });
    cell.append(chips);
    if (list.length > 3) cell.append(el('span', 'more', `+${list.length - 3}`));
    cell.onclick = () => {
      selected = key;
      if (d.getMonth() !== view.getMonth()) { view = new Date(d.getFullYear(), d.getMonth(), 1); }
      render();
    };
    cell.ondblclick = () => openEvent(null, key);
    grid.append(cell);
  }
  renderDay();
}
function renderDay(){
  const d = parseYmd(selected);
  $('#dayTitle').textContent = `${d.getMonth() + 1}월 ${d.getDate()}일 (${WD[d.getDay()]})`;
  const ul = $('#dayList'); ul.replaceChildren();
  const list = eventsOn(selected);
  if (!list.length) { ul.append(el('li', 'empty', '일정이 없습니다')); ul.firstChild.style.background = 'none'; ul.firstChild.style.cursor = 'default'; return; }
  for (const e of list) {
    const li = el('li'); const bar = el('div', 'bar'); bar.style.background = e.color || COLORS[0];
    const body = el('div'); body.style.minWidth = '0';
    let t = e.allDay ? '종일' : [e.start, e.end].filter(Boolean).join(' – ') || '시간 미정';
    if (e.endDate && e.endDate !== e.date) { const a = parseYmd(e.date), b = parseYmd(e.endDate); t += ` · ${a.getMonth()+1}/${a.getDate()}~${b.getMonth()+1}/${b.getDate()}`; }
    body.append(el('div', 't', t), el('div', 'ti', e.title));
    if (e.memo) body.append(el('div', 'memo', e.memo));
    li.append(bar, body); li.onclick = () => openEvent(e);
    ul.append(li);
  }
}

/* ---------- 일정 대화상자 ---------- */
const dlg = $('#eventDlg'), form = $('#eventForm');
let editing = null;
(function buildColors(){
  const box = $('#colors');
  COLORS.forEach((c, i) => {
    const lab = el('label'); lab.style.display = 'block';
    const r = el('input'); r.type = 'radio'; r.name = 'color'; r.value = c; if (i === 0) r.checked = true;
    const sw = el('span'); sw.style.background = c;
    lab.append(r, sw); box.append(lab);
  });
})();
function syncTimeRow(){ $('#timeRow').style.display = form.allDay.checked ? 'none' : ''; }
form.allDay.onchange = syncTimeRow;
function openEvent(ev, date){
  editing = ev;
  $('#eventDlgTitle').textContent = ev ? '일정 수정' : '새 일정';
  $('#delBtn').style.display = ev ? '' : 'none';
  form.title.value = ev ? ev.title : '';
  form.date.value = ev ? ev.date : (date || selected);
  form.endDate.value = ev && ev.endDate ? ev.endDate : '';
  form.allDay.checked = ev ? !!ev.allDay : false;
  form.start.value = ev ? (ev.start || '') : '';
  form.end.value = ev ? (ev.end || '') : '';
  form.memo.value = ev ? (ev.memo || '') : '';
  const col = ev && ev.color || COLORS[0];
  form.querySelectorAll('input[name=color]').forEach(r => r.checked = r.value === col);
  syncTimeRow(); dlg.showModal(); setTimeout(() => form.title.focus(), 30);
}
form.onsubmit = ev => {
  ev.preventDefault();
  const title = form.title.value.trim(); if (!title) return;
  let endDate = form.endDate.value || '';
  if (endDate && endDate < form.date.value) { alert('종료일이 시작일보다 빠릅니다.'); return; }
  if (endDate === form.date.value) endDate = '';
  const allDay = form.allDay.checked;
  upsert({
    id: editing ? editing.id : uid(), title, date: form.date.value, endDate,
    allDay, start: allDay ? '' : form.start.value, end: allDay ? '' : form.end.value,
    color: (form.querySelector('input[name=color]:checked') || {}).value || COLORS[0],
    memo: form.memo.value.trim(), createdAt: editing ? editing.createdAt : Date.now()
  });
  selected = form.date.value; const d = parseYmd(selected); view = new Date(d.getFullYear(), d.getMonth(), 1);
  dlg.close(); render();
};
$('#cancelBtn').onclick = () => dlg.close();
$('#delBtn').onclick = () => { if (editing && confirm(`'${editing.title}' 일정을 삭제할까요?`)) { remove(editing.id); dlg.close(); } };

/* ---------- 메모 ---------- */
const liveNotes = () => notes.filter(n => !n.deleted).sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
function fmtTime(ts){
  if (!ts) return '';
  const d = new Date(ts), now = new Date();
  if (ymd(d) === ymd(now)) return `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  if (d.getFullYear() === now.getFullYear()) return `${d.getMonth() + 1}월 ${d.getDate()}일`;
  return `${d.getFullYear()}.${d.getMonth() + 1}.${d.getDate()}`;
}
function splitNote(text){
  const t = (text || '').trim(), i = t.indexOf('\n');
  return i < 0 ? [t, ''] : [t.slice(0, i).trim(), t.slice(i + 1).trim()];
}
function renderNotes(){
  const q = $('#noteSearch').value.trim().toLowerCase();
  const g = $('#noteGrid'); g.replaceChildren();
  const list = liveNotes().filter(n => !q || (n.text || '').toLowerCase().includes(q));
  if (!list.length) { g.append(el('div', 'empty', q ? '검색 결과가 없습니다' : '메모가 없습니다. + 버튼으로 추가하세요')); return; }
  for (const n of list) {
    const [title, rest] = splitNote(n.text);
    const c = el('button', 'ncard');
    c.append(el('div', 'nt', title || '빈 메모'));
    if (rest) c.append(el('div', 'np', rest));
    c.append(el('div', 'nd', fmtTime(n.updatedAt)));
    c.onclick = () => openNote(n);
    g.append(c);
  }
}
function upsertNote(n){
  n.updatedAt = Date.now();
  const i = notes.findIndex(x => x.id === n.id);
  if (i >= 0) notes[i] = n; else notes.push(n);
  dirty = true; persist(); renderNotes(); scheduleSave();
}
function removeNote(id){ upsertNote({ id, deleted: true, text: '' }); }

const ndlg = $('#noteDlg'), ntext = $('#noteText');
let editingNote = null, noteOrig = '', noteTimer = null;
const trimEnd = s => s.replace(/\s+$/, '');
function openNote(n){
  editingNote = n || null; noteOrig = n ? n.text : '';
  ntext.value = noteOrig;
  $('#noteDel').style.display = n ? '' : 'none';
  $('#noteMeta').textContent = n ? `수정 ${fmtTime(n.updatedAt)}` : '';
  ndlg.showModal(); setTimeout(() => ntext.focus(), 30);
}
function saveNoteNow(){ // 입력 중 자동 저장
  clearTimeout(noteTimer);
  const t = trimEnd(ntext.value);
  if (t === trimEnd(noteOrig) || !t.trim()) return;
  const n = { id: editingNote ? editingNote.id : uid(), text: t, createdAt: editingNote ? editingNote.createdAt : Date.now() };
  upsertNote(n); editingNote = n; noteOrig = t;
  $('#noteDel').style.display = ''; $('#noteMeta').textContent = '저장됨';
}
ntext.addEventListener('input', () => { clearTimeout(noteTimer); noteTimer = setTimeout(saveNoteNow, 1500); });
ndlg.addEventListener('close', () => {
  clearTimeout(noteTimer);
  const t = trimEnd(ntext.value);
  if (t === trimEnd(noteOrig)) return;
  if (!t.trim()) { if (editingNote) removeNote(editingNote.id); return; } // 내용을 모두 지우면 삭제
  saveNoteNow();
});
$('#noteDel').onclick = () => {
  if (!editingNote || !confirm('이 메모를 삭제할까요?')) return;
  const id = editingNote.id; noteOrig = ntext.value; ndlg.close(); removeNote(id);
};
$('#noteSearch').addEventListener('input', renderNotes);
$('#addNoteBtn').onclick = () => openNote(null);

function setMode(m){
  mode = m; LS.set('cal.mode', m);
  document.body.classList.toggle('notes-mode', m === 'notes');
  $('#modeBtn').textContent = m === 'notes' ? '📅' : '📝';
  $('#modeBtn').title = m === 'notes' ? '캘린더' : '메모';
  render(); renderNotes();
}
$('#modeBtn').onclick = () => setMode(mode === 'notes' ? 'cal' : 'notes');

/* ---------- 설정 대화상자 ---------- */
const sdlg = $('#settingsDlg'), sform = $('#settingsForm');
function readSettings(){ return { owner: sform.owner.value.trim(), repo: sform.repo.value.trim(), branch: sform.branch.value.trim() || 'main', path: sform.path.value.trim().replace(/^\/+/, '') || 'events.json', token: sform.token.value.replace(/\s+/g, '') }; }
function openSettings(){
  for (const k of ['owner','repo','branch','path','token']) sform[k].value = cfg[k] || '';
  if (!sform.branch.value) sform.branch.value = 'main';
  if (!sform.path.value) sform.path.value = 'events.json';
  $('#testMsg').textContent = ''; $('#testMsg').className = 'msg';
  sdlg.showModal();
}
async function testConnection(c){
  const msg = $('#testMsg'); msg.className = 'msg';
  const missing = [['owner','GitHub 사용자명'],['repo','데이터 저장소'],['token','토큰']].filter(([k]) => !c[k]).map(([, n]) => n);
  if (missing.length) { msg.className = 'msg bad'; msg.textContent = `✗ 비어 있는 칸: ${missing.join(', ')}\n(회색 글씨는 예시일 뿐 입력된 값이 아닙니다)`; return false; }
  if (/[^\x21-\x7e]/.test(c.token)) { msg.className = 'msg bad'; msg.textContent = '✗ 토큰에 영문/숫자 외의 문자가 섞여 있습니다. 토큰을 다시 복사해 붙여넣으세요.'; return false; }
  msg.textContent = '확인 중…';
  try {
    const r = await fetch(`https://api.github.com/repos/${encodeURIComponent(c.owner)}/${encodeURIComponent(c.repo)}`, { cache:'no-store', headers: ghHeaders(c) });
    if (!r.ok) throw await httpError(r);
    const repo = await r.json();
    const lines = [];
    if (!repo.private) { msg.className = 'msg bad'; msg.textContent = '⚠ 이 저장소는 공개(Public) 상태입니다!\n누구나 일정을 볼 수 있으니 저장소를 Private으로 바꾸세요.'; return false; }
    lines.push('✓ 비공개 저장소 확인');
    const f = await fetch(contentsUrl(c, true), { cache:'no-store', headers: ghHeaders(c) });
    if (f.ok) lines.push('✓ 데이터 파일 읽기 가능');
    else if (f.status === 404) lines.push('✓ 데이터 파일 없음 → 첫 저장 때 자동 생성');
    else throw await httpError(f);
    if (repo.permissions && repo.permissions.push === false) { msg.className = 'msg bad'; msg.textContent = lines.join('\n') + '\n✗ 쓰기 권한 없음: 토큰 권한에서 Contents를 "Read and write"로 설정하세요.'; return false; }
    msg.className = 'msg ok'; msg.textContent = lines.join('\n'); return true;
  } catch (e) {
    msg.className = 'msg bad';
    msg.textContent = e.status === 401 ? '✗ 토큰이 올바르지 않거나 만료되었습니다.'
      : e.status === 404 ? '✗ 저장소를 찾을 수 없습니다.\n사용자명/저장소 이름, 그리고 토큰의 저장소 접근 범위를 확인하세요.'
      : e.status === 403 ? '✗ 접근 거부: 토큰 권한을 확인하세요.'
      : e instanceof TypeError ? '✗ GitHub에 연결하지 못했습니다(네트워크 오류).\n인터넷 연결, 광고 차단 확장 프로그램, 또는 index.html을 파일로 직접 연 것이 아닌지(주소가 https://…github.io 인지) 확인하세요.'
      : `✗ ${e.message}`;
    return false;
  }
}
$('#testBtn').onclick = () => testConnection(readSettings());
sform.onsubmit = async ev => {
  ev.preventDefault();
  const c = readSettings();
  if (!(await testConnection(c))) return;
  const changedTarget = c.owner !== cfg.owner || c.repo !== cfg.repo || c.path !== cfg.path || c.branch !== cfg.branch;
  if (changedTarget && cfg.owner && live().length && !confirm('저장소가 바뀌었습니다. 이 기기의 기존 일정·메모를 새 저장소에 합칠까요?\n(취소하면 이 기기의 기존 캐시를 지우고 새 저장소 내용을 불러옵니다)')) { events = []; notes = []; dirty = false; persist(); }
  cfg = c; LS.set('cal.cfg', cfg); sdlg.close(); sync();
};
$('#closeSettings').onclick = () => sdlg.close();
$('#logoutBtn').onclick = () => {
  if (!confirm('이 기기에 저장된 토큰과 일정 캐시를 삭제할까요?\n(GitHub에 저장된 일정은 그대로 남습니다. 동기화 안 된 변경사항은 사라집니다)')) return;
  ['cal.cfg','cal.events','cal.notes','cal.dirty','cal.lastSync'].forEach(LS.del);
  cfg = { owner:'', repo:'', token:'', branch:'main', path:'events.json' }; events = []; notes = []; dirty = false; lastSync = 0;
  sdlg.close(); render(); renderNotes(); idleStatus();
};
$('#exportBtn').onclick = () => {
  const blob = new Blob([JSON.stringify({ version: 1, exportedAt: new Date().toISOString(), events: live(), notes: liveNotes() }, null, 2)], { type: 'application/json' });
  const a = el('a'); a.href = URL.createObjectURL(blob); a.download = `calendar-backup-${ymd(new Date())}.json`; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};

/* ---------- 내비게이션 ---------- */
function shiftMonth(n){ view = new Date(view.getFullYear(), view.getMonth() + n, 1); render(); }
$('#prev').onclick = () => shiftMonth(-1);
$('#next').onclick = () => shiftMonth(1);
$('#todayBtn').onclick = () => { const t = new Date(); view = new Date(t.getFullYear(), t.getMonth(), 1); selected = ymd(t); render(); };
$('#addBtn').onclick = () => openEvent(null, selected);
$('#fab').onclick = () => mode === 'notes' ? openNote(null) : openEvent(null, selected);
$('#settingsBtn').onclick = openSettings;
$('#syncBtn').onclick = sync;
document.addEventListener('keydown', e => {
  if (document.querySelector('dialog[open]') || e.metaKey || e.ctrlKey || e.altKey || /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  if (e.key === 'm') setMode(mode === 'notes' ? 'cal' : 'notes');
  else if (e.key === 'n') { e.preventDefault(); mode === 'notes' ? openNote(null) : openEvent(null, selected); }
  else if (mode === 'notes') return;
  else if (e.key === 'ArrowLeft') shiftMonth(-1);
  else if (e.key === 'ArrowRight') shiftMonth(1);
  else if (e.key === 't') $('#todayBtn').click();
});
let tx = null, ty = null;
$('.cal').addEventListener('touchstart', e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
$('.cal').addEventListener('touchend', e => {
  if (tx == null) return;
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty; tx = null;
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) shiftMonth(dx < 0 ? 1 : -1);
});

/* ---------- 자동 동기화 트리거 ---------- */
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') sync();
  else if (ndlg.open) saveNoteNow(); // 폰에서 앱을 전환할 때 작성 중인 메모 보존
});
window.addEventListener('online', sync);
window.addEventListener('offline', idleStatus);
setInterval(() => { if (document.visibilityState === 'visible') sync(); }, 60000);

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});

setMode(mode); idleStatus();
if (configured()) sync(); else setTimeout(openSettings, 300);
</script>
</body>
</html>
